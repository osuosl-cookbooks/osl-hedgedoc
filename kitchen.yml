---
driver:
  name: vagrant

verifier:
  name: inspec

transport:
  name: rsync

provisioner:
  name: cinc_infra
  product_version: 18
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true

platforms:
  - name: almalinux-9
  - name: almalinux-10

suites:
  - name: default
    run_list:
      - recipe[hedgedoc_test]
  - name: mysql
    run_list:
      - recipe[hedgedoc_test::mysql]
    # Reuse the default suite's profile; only the DB dialect differs.
    verifier:
      inspec_tests:
        - test/integration/default
      inputs:
        default_extras: false
        db_dialect: mysql
  - name: ldap
    run_list:
      - recipe[hedgedoc_test::ldap]
    # Reuse the default suite's profile; only the auth toggles differ.
    verifier:
      inspec_tests:
        - test/integration/default
      inputs:
        default_extras: false
        test_ldap: true
  - name: oidc
    run_list:
      - recipe[hedgedoc_test::oidc]
    verifier:
      inspec_tests:
        - test/integration/default
      inputs:
        default_extras: false
        test_oidc: true
